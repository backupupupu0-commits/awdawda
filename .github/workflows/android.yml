name: Build HAKAWI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project (unzip if the ZIP was uploaded as-is)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls ./*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          fi
          if [ ! -f settings.gradle.kts ]; then
            F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
            if [ -n "$F" ]; then cp -a "$(dirname "$F")"/. . ; fi
          fi
          ls -la

      - name: Check cloud settings
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use your own signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/custom.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/custom.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASS" >> "$GITHUB_ENV"
          fi

      - name: Generate Gradle wrapper (if missing)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version 8.10.2 --no-daemon

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HAKAWI-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HAKAWI - latest build
          body: Latest build of the HAKAWI app. Download app-release.apk and install it.
          files: app/build/outputs/apk/release/app-release.apk

  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project (unzip if needed)
        run: |
          if [ ! -d docs ]; then
            ZIP=$(ls ./*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          fi
      - name: Build the share page
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          printf 'window.HAKAWI = { supabaseUrl: "%s", anonKey: "%s", apkUrl: "%s" };\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" \
            "https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
